; PlatformIO project configuration
;
; Drives an 80x40 4-scan SM16208 "ZIGZAG8" panel on the UNMODIFIED library:
; the scan-type remap lives in src/main.cpp as a sketch-local policy struct,
; so no PR merge or library edit is required (see README.md and
; doc/Panel_80x40_4Scan_ZigZag8.md in the repo root).
;
; Commands (run from this folder):
;   pio run              build
;   pio run -t upload    flash
;   pio device monitor   serial monitor @ 115200

[platformio]
default_envs = esp32
description = 80x40 ZIGZAG8 panel via a sketch-local scan-type mapping policy (vanilla library)

[env:esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
framework = arduino
board = wemos_d1_mini32
upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    adafruit/Adafruit BusIO
    adafruit/Adafruit GFX Library
    ; The DMA library from this repo's checkout (repo root = ../..). It only
    ; needs to be at vanilla master for this example to build - point at the
    ; master branch with: git checkout master
    ../..
    ; Alternatively, always build against upstream master regardless of the
    ; local checkout (uncomment, and remove the ../.. line):
    ; https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git#master
