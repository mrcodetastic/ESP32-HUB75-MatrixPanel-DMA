[platformio]
default_envs = esp32, esp32_no_gfx, esp32s2, esp32s2_no_gfx, esp32s3, esp32s3_no_gfx
description = HUB75 ESP32 I2S DMA test patterns example
;src_dir = src
; SCons build cache: reuses object files between builds/clean/build-dir wipes.
; Lives under .pio/ so it is already git-ignored and easy to purge.
build_cache_dir = .pio/build_cache

[env]
# NOTE: pinned to the pioarduino RC that ships arduino-esp32 4.0.0-RC1 + ESP-IDF 6.1.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00-RC1/platform-espressif32.zip
board = wemos_d1_mini32
lib_deps =
    # Needs > 3.10.7 to pick up https://github.com/FastLED/FastLED/commit/401b03e7e5c6478c38050dd113426850ccc8948b
    https://github.com/FastLED/FastLED
    Wire
    adafruit/Adafruit BusIO
    adafruit/Adafruit GFX Library
    # Local checkout rather than the git remote, so edits to src/ take effect.
    symlink://../../
upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ---------------------------------------------------------------------------
; Arduino framework -- prebuilt framework libs, fast, ideal for CI + flashing.
; Every <target> also has a <target>_no_gfx twin (-DNO_GFX) that exercises the
; no-GFX class path. Together they cover the per-SoC DMA drivers selected by
; platform_detect.hpp:
;   esp32 / esp32s2 -> platforms/esp32/esp32_i2s_parallel_dma.cpp
;   esp32s3         -> platforms/esp32s3/gdma_lcd_parallel16.cpp
; ---------------------------------------------------------------------------
[env:esp32]
framework = arduino

[env:esp32_no_gfx]
framework = arduino
build_flags = -DNO_GFX

[env:esp32s2]
board = esp32-s2-saola-1
framework = arduino

[env:esp32s2_no_gfx]
board = esp32-s2-saola-1
framework = arduino
build_flags = -DNO_GFX

[env:esp32s3]
board = esp32-s3-devkitc-1
framework = arduino

[env:esp32s3_no_gfx]
board = esp32-s3-devkitc-1
framework = arduino
build_flags = -DNO_GFX

; ---------------------------------------------------------------------------
; ESP-IDF (Arduino-as-component). Deliberately NOT in default_envs: compiling the
; whole arduino-esp32 component graph is slow. `custom_component_remove` prunes
; the optional components a HUB75 test does not use (modem, modbus, rainmaker,
; zigbee, libsodium, dsp, ...). Pure `framework = espidf` cannot see Arduino-only
; libs -- they declare "frameworks": "arduino" (e.g. FastLED) -- hence the hybrid
; framework list. As with the Arduino envs, the unsuffixed env builds with GFX
; and the _no_gfx twin with -DNO_GFX.
; ---------------------------------------------------------------------------
[env:esp32idf]
framework = arduino, espidf
custom_component_remove =
    chmorgan/esp-libhelix-mp3
    espressif/esp_modem
    espressif/esp-modbus
    espressif/esp_insights
    espressif/esp_rainmaker
    espressif/esp-zigbee-lib
    espressif/esp-dsp
    espressif/libsodium
    espressif/qrcode
    espressif/dm9051
    espressif/ksz8851snl
    espressif/lan867x
    espressif/w5500

[env:esp32idf_no_gfx]
extends = env:esp32idf
build_flags = -DNO_GFX
