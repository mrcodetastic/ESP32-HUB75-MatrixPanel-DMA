name: PlatformIO CI

on:
  push:
    branches: [ master, dev ]
    paths-ignore:
      - '**.md'
      - 'doc/**'
  pull_request:
    branches: [ master, dev ]
    paths-ignore:
      - '**.md'
      - 'doc/**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each env encodes its framework (arduino vs arduino+espidf) and GFX
        # flavor; see examples/PIO_TestPatterns/platformio.ini. The _no_gfx
        # twins build with -DNO_GFX. envs cover every supported SoC -- esp32
        # and esp32s2 use esp32_i2s_parallel_dma.cpp, esp32s3 uses
        # gdma_lcd_parallel16.cpp.
        env:
          - esp32
          - esp32_no_gfx
          - esp32s2
          - esp32s2_no_gfx
          - esp32s3
          - esp32s3_no_gfx
          - esp32idf
          - esp32idf_no_gfx
        example:
          - "examples/PIO_TestPatterns"

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python 3.x
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Run PlatformIO CI (${{ matrix.env }})
      run: pio run -e ${{ matrix.env }} -d ${{ matrix.example }}
