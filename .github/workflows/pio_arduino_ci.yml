name: PlatformIO CI

on:
  push:
    branches: [ master, dev ]
    paths-ignore:
      - '**.md'
      - 'doc/**'
  pull_request:
    branches: [ master, dev ]
    paths-ignore:
      - '**.md'
      - 'doc/**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: ["Arduino"]
        no_gfx: ["", "-DNO_GFX"]
        example:
          - "examples/PIO_TestPatterns"

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Python 3.x
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Run PlatformIO CI (Arduino)
      if: matrix.framework == 'Arduino'
      env: 
        PLATFORMIO_BUILD_FLAGS: ${{ matrix.no_gfx }}
        PLATFORMIO_CI_SRC: ${{ matrix.example }}
      run: pio ci -e esp32 -c ${{ matrix.example }}/platformio.ini

    - name: Run PlatformIO CI (ESP-IDF Framework)
      if: matrix.framework == 'IDF'
      env: 
        PLATFORMIO_BUILD_FLAGS: -DIDF_BUILD ${{ matrix.no_gfx }}
      run: pio run -d ${{ matrix.example }} -e esp32idf
